name: Security · Secrets

on:
  workflow_call:
    inputs:
      gate-mode:
        description: 'report: findings only warn. block: findings fail the check on pull requests.'
        type: string
        default: report

permissions: {}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      GATE_MODE: ${{ inputs.gate-mode }}
    steps:
      - name: Validate inputs
        run: |
          case "$GATE_MODE" in
            report | block) ;;
            *) echo "::error title=Invalid gate-mode::Expected 'report' or 'block', got '$GATE_MODE'."; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan commits for secrets
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          is_commit() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$1" =~ ^0+$ ]] && git cat-file -e "${1}^{commit}" 2>/dev/null
          }
          require_commit() {
            if ! is_commit "$1"; then
              echo "::error title=Gitleaks scan range invalid::$2 commit is missing from the checkout; refusing to report a clean scan."
              exit 3
            fi
          }
          log_opts=()
          scope="full history"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            require_commit "$PR_BASE_SHA" "Pull request base"
            require_commit "$PR_HEAD_SHA" "Pull request head"
            log_opts=(--log-opts "${PR_BASE_SHA}..${PR_HEAD_SHA}")
            scope="pull request commits ${PR_BASE_SHA:0:7}..${PR_HEAD_SHA:0:7}"
          elif [ "$EVENT_NAME" = "push" ]; then
            require_commit "$PUSH_AFTER_SHA" "Pushed head"
            if is_commit "$PUSH_BEFORE_SHA"; then
              log_opts=(--log-opts "${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}")
              scope="pushed commits ${PUSH_BEFORE_SHA:0:7}..${PUSH_AFTER_SHA:0:7}"
            fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          set +e
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 2 \
            --report-format sarif --report-path gitleaks.sarif "${log_opts[@]}" .
          status=$?
          set -e
          case "$status" in
            0 | 2) ;;
            *) echo "::error title=Gitleaks execution failed::gitleaks exited with status $status (not a secret finding)."; exit "$status" ;;
          esac
          echo "count=$(jq '[.runs[].results // [] | .[]] | length' gitleaks.sarif)" >> "$GITHUB_OUTPUT"

      - name: Write findings summary
        env:
          SCOPE: ${{ steps.scan.outputs.scope }}
          COUNT: ${{ steps.scan.outputs.count }}
        run: |
          {
            echo "## Secrets scan (Gitleaks v${GITLEAKS_VERSION})"
            echo
            echo "Scope: ${SCOPE}. Mode: \`${GATE_MODE}\`. Findings: ${COUNT}. Secret values are redacted."
            if [ "$COUNT" -gt 0 ]; then
              echo
              echo "| Rule | File | Line | Commit |"
              echo "| --- | --- | --- | --- |"
              jq -r '.runs[].results // [] | .[] | "| \(.ruleId) | `\(.locations[0].physicalLocation.artifactLocation.uri)` | \(.locations[0].physicalLocation.region.startLine) | `\((.partialFingerprints.commitSha // "")[0:7])` |"' gitleaks.sarif
              echo
              echo "Treat every finding as exposed until verified: rotate or revoke the credential first. Deleting it from the code does not remove it from git history."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Enforce gate
        if: steps.scan.outputs.count != '0'
        env:
          SCOPE: ${{ steps.scan.outputs.scope }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GATE_MODE" = "block" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::error title=Secrets detected::Gitleaks found potential secrets in ${SCOPE}. See the job summary for file and line. Rotate the credential; do not just delete it."
            exit 1
          fi
          echo "::warning title=Secrets detected (report-only)::Gitleaks found potential secrets in ${SCOPE}. See the job summary and Security → Code scanning."
