name: Deploy Media Service Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: content_service
          POSTGRES_PASSWORD: content_service
          POSTGRES_DB: content_service_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://content_service:content_service@localhost:5432/content_service_ci
      SERVICE_SECRET: ci-service-secret
      OPENAI_API_KEY: sk-test-fake-key-for-ci
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "env_tag=production" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push content-service
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.env_tag }}
          cache-from: type=gha,scope=content-service-production
          cache-to: type=gha,mode=max,scope=content-service-production

      - name: Build and push render-service
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./render-service
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.env_tag }}
          cache-from: type=gha,scope=render-service-production
          cache-to: type=gha,mode=max,scope=render-service-production
