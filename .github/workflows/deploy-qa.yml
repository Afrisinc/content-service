name: Deploy Media Service QA

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "env_tag=qa" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Plain `docker build` on a fresh ubuntu-latest VM has no cache to draw
      # on, so `yarn install` / `pip install` reran from scratch and produced a
      # brand-new layer digest on every single deploy, even when dependencies
      # hadn't changed. That forced a full re-download of both fat dependency
      # layers on every deploy, not just the first — this is the actual reason
      # deploys have kept timing out. GHA-backed Buildx cache makes those
      # layers reproducible across runs, so the VPS pull below only fetches
      # what actually changed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push content-service
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.env_tag }}
          cache-from: type=gha,scope=content-service-qa
          cache-to: type=gha,mode=max,scope=content-service-qa

      # Built from ./render-service: its Dockerfile copies requirements.txt and
      # afrisinc_render relative to that directory, not to the repo root.
      - name: Build and push render-service
        uses: docker/build-push-action@v6
        with:
          context: ./render-service
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.env_tag }}
          cache-from: type=gha,scope=render-service-qa
          cache-to: type=gha,mode=max,scope=render-service-qa

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          # PASS DEPLOY CREDS TO VPS
          envs: DEPLOY_GHCR_USERNAME,DEPLOY_GHCR_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}/content-service/qa"
            cd $APP_PATH

            echo "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin

            docker compose pull

            # Migrations run before the new image serves traffic, as a one-off
            # container: a failed migration stops the deploy instead of leaving
            # the app up against a schema it cannot read. --no-deps keeps it from
            # starting the render service just to run prisma.
            docker compose run --rm --no-deps --entrypoint "" \
              content_service_qa \
              npm run db:deploy

            docker compose up -d
            docker compose ps

            # Scoped to this project's own two repos rather than `-af`, which scans
            # every image on the host — this VPS runs ~20 other services, so a global
            # prune can both take unpredictably long and reap an unrelated service's
            # image mid-restart. `|| true` so a cleanup hiccup never reports the
            # deploy itself as failed.
            for repo in content-service render-service; do
              docker images "ghcr.io/${{ secrets.GHCR_OWNER }}/$repo" --format "{{.Repository}}:{{.Tag}}" \
                | grep -v ":qa$" \
                | grep -v ":${{ steps.meta.outputs.short_sha }}$" \
                | xargs -r docker rmi -f
            done || true
