name: Deploy Media Service Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: content_service
          POSTGRES_PASSWORD: content_service
          POSTGRES_DB: content_service_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://content_service:content_service@localhost:5432/content_service_ci
      SERVICE_SECRET: ci-service-secret
      OPENAI_API_KEY: sk-test-fake-key-for-ci
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "env_tag=production" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push content-service
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.env_tag }}
          cache-from: type=gha,scope=content-service-production
          cache-to: type=gha,mode=max,scope=content-service-production

      - name: Build and push render-service
        uses: docker/build-push-action@v6
        with:
          context: ./render-service
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.env_tag }}
          cache-from: type=gha,scope=render-service-production
          cache-to: type=gha,mode=max,scope=render-service-production

      - name: Kick off deployment on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: DEPLOY_GHCR_USERNAME,DEPLOY_GHCR_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}/content-service/production"
            cd $APP_PATH

            rm -f deploy-status.txt deploy.log

            setsid nohup bash -c '
              set -e
              echo "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin
              docker compose pull --quiet

              docker compose run --rm --no-deps --entrypoint "" \
                content_service_production \
                npm run db:deploy

              docker compose up -d --no-deps render_service_production

              elapsed=0
              while [ "$(docker inspect -f "{{.State.Health.Status}}" render_service_production 2>/dev/null)" != "healthy" ]; do
                if [ "$elapsed" -ge 180 ]; then
                  echo FAILED > deploy-status.txt
                  docker compose logs --tail=100 render_service_production >> deploy.log 2>&1
                  exit 1
                fi
                sleep 10
                elapsed=$((elapsed + 10))
              done

              docker compose up -d
              echo DONE > deploy-status.txt

              for repo in content-service render-service; do
                docker images "ghcr.io/${{ secrets.GHCR_OWNER }}/$repo" --format "{{.Repository}}:{{.Tag}}" \
                  | grep -v ":production$" \
                  | grep -v ":${{ steps.meta.outputs.short_sha }}$" \
                  | xargs -r docker rmi -f
              done || true
            ' < /dev/null > deploy.log 2>&1 &
            disown

            echo "Deploy kicked off in the background — polling for it next"

      - name: Load deploy SSH key for polling
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Wait for deployment to finish
        run: |
          set -e
          REMOTE="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          APP_PATH="${{ secrets.VPS_APP_PATH }}/content-service/production"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          for i in $(seq 1 60); do
            STATUS=$(ssh $SSH_OPTS "$REMOTE" "cd $APP_PATH && cat deploy-status.txt 2>/dev/null || true")

            if [ "$STATUS" = "DONE" ]; then
              echo "Deploy finished successfully"
              ssh $SSH_OPTS "$REMOTE" "cd $APP_PATH && docker compose ps content_service_production && rm -f deploy-status.txt deploy.log"
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "::error::Deploy failed on the server — dumping its log"
              ssh $SSH_OPTS "$REMOTE" "cd $APP_PATH && cat deploy.log && rm -f deploy-status.txt deploy.log"
              exit 1
            fi

            echo "Still deploying... ($((i * 15))s elapsed)"
            sleep 15
          done

          echo "::error::Deploy did not finish within 15 minutes"
          exit 1
