version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 5
    semver-major-days: 21
  open-pull-requests-limit: 5
  groups:
    actions:
      patterns: [ "*" ]

- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 5
    semver-major-days: 21
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      update-types: [ "minor", "patch" ]

- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 5
    semver-major-days: 21
  open-pull-requests-limit: 5
