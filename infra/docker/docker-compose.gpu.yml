name: afrisinc-studio

x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  ollama:
    <<: *nvidia
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: 1

  comfyui:
    image: ${COMFYUI_IMAGE:-ghcr.io/ai-dock/comfyui:v2-cuda-12.1.1-base-22.04}
    <<: *nvidia
    environment:
      CLI_ARGS: --listen 0.0.0.0 --port 8188
    volumes:
      - comfyui-models:/opt/ComfyUI/models
      - comfyui-output:/opt/ComfyUI/output
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    restart: unless-stopped

  media-worker:
    <<: *nvidia
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16

  blender-worker:
    <<: *nvidia
    environment:
      CYCLES_DEVICE: OPTIX
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics

volumes:
  comfyui-models:
  comfyui-output:
