name: Security · SAST

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array of {"language", "build-mode"} objects, e.g. [{"language":"python","build-mode":"none"}].'
        type: string
        required: true
      queries:
        description: 'CodeQL query suite: security-extended or security-and-quality.'
        type: string
        default: security-extended

permissions: {}

jobs:
  codeql:
    name: SAST (CodeQL, ${{ matrix.target.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.target.language }}
          build-mode: ${{ matrix.target.build-mode }}
          queries: ${{ inputs.queries }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.target.language }}
