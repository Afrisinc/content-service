global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: studio-api
    metrics_path: /studio/metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
