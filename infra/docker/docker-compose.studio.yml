name: afrisinc-studio

x-studio-env: &studio-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-studio}:${RABBITMQ_PASSWORD:-studio}@rabbitmq:5672
  STUDIO_S3_ENDPOINT: http://minio:9000
  STUDIO_S3_BUCKET: ${STUDIO_S3_BUCKET:-animation-platform}
  STUDIO_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-studio}
  STUDIO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-studio-secret}
  STUDIO_S3_FORCE_PATH_STYLE: "true"
  OLLAMA_BASE_URL: http://ollama:11434
  COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://comfyui:8188}
  MEDIA_WORKER_URL: http://media-worker:8095
  MEDIA_WORKER_API_KEY: ${MEDIA_WORKER_API_KEY:-}
  STUDIO_ENABLED: "true"

x-worker-limits: &worker-limits
  deploy:
    resources:
      limits:
        cpus: "${WORKER_CPU_LIMIT:-2}"
        memory: ${WORKER_MEMORY_LIMIT:-4g}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-content_service}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-studio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-studio}
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-studio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-studio-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set studio http://minio:9000 ${MINIO_ROOT_USER:-studio} ${MINIO_ROOT_PASSWORD:-studio-secret} &&
      mc mb --ignore-existing studio/${STUDIO_S3_BUCKET:-animation-platform} &&
      mc anonymous set download studio/${STUDIO_S3_BUCKET:-animation-platform}/library &&
      echo bucket ready"
    restart: "no"

  ollama:
    image: ollama/ollama:0.5.4
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  media-worker:
    build:
      context: ../..
      dockerfile: workers/media-worker/Dockerfile
    environment:
      <<: *studio-env
      STUDIO_WORKER_NAME: media-worker
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      STUDIO_TTS_ENGINE: ${STUDIO_TTS_ENGINE:-kokoro}
    volumes:
      - studio-models:/models
      - studio-work:/tmp/studio
    ports:
      - "${MEDIA_WORKER_PORT:-8095}:8095"
    depends_on:
      minio:
        condition: service_healthy
    <<: *worker-limits

  media-worker-compose:
    build:
      context: ../..
      dockerfile: workers/media-worker/Dockerfile
    command: ["python", "worker.py", "compose"]
    environment:
      <<: *studio-env
      STUDIO_WORKER_NAME: media-worker-compose
    volumes:
      - studio-models:/models
      - studio-work:/tmp/studio
    depends_on:
      rabbitmq:
        condition: service_healthy
    <<: *worker-limits

  media-worker-qa:
    build:
      context: ../..
      dockerfile: workers/media-worker/Dockerfile
    command: ["python", "worker.py", "qa"]
    environment:
      <<: *studio-env
      STUDIO_WORKER_NAME: media-worker-qa
    volumes:
      - studio-work:/tmp/studio
    depends_on:
      rabbitmq:
        condition: service_healthy
    <<: *worker-limits

  blender-worker:
    build:
      context: ../..
      dockerfile: workers/blender-engine/Dockerfile
    environment:
      <<: *studio-env
      STUDIO_WORKER_NAME: blender-worker
      STUDIO_ASSET_ROOT: /assets
    volumes:
      - studio-assets:/assets:ro
      - studio-work:/tmp/studio
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${BLENDER_CPU_LIMIT:-6}"
          memory: ${BLENDER_MEMORY_LIMIT:-12g}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  ollama-models:
  studio-models:
  studio-assets:
  studio-work:
  prometheus-data:
  grafana-data:
