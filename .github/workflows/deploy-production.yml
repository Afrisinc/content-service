name: Deploy Media Service Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "env_tag=production" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push content-service
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.short_sha }} \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.env_tag }} .
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.short_sha }}
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/content-service:${{ steps.meta.outputs.env_tag }}

      # Built from ./render-service: its Dockerfile copies requirements.txt and
      # afrisinc_render relative to that directory, not to the repo root.
      - name: Build and push render-service
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.short_sha }} \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.env_tag }} \
            ./render-service
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.short_sha }}
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/render-service:${{ steps.meta.outputs.env_tag }}

      # A prior version of this job ran the whole deploy — including `docker
      # compose pull` and the wait for render's healthcheck — inside one long
      # SSH session. That kept dying well short of any timeout this workflow
      # configures. The VPS runs this deploy alongside ~20 other services on
      # 4 vCPUs and is routinely overloaded (load average in the double
      # digits), so neither the pull nor the session itself can be trusted to
      # finish quickly or survive a held-open connection. So everything slow
      # runs detached on the server, and a separate step polls it with short,
      # independent connections instead of one held-open session.
      - name: Kick off deployment on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 2m

          # PASS DEPLOY CREDS TO VPS
          envs: DEPLOY_GHCR_USERNAME,DEPLOY_GHCR_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}/content-service/production"
            cd $APP_PATH

            echo "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin

            rm -f deploy-status.txt deploy.log

            # docker compose pull used to run here, synchronously. On this host
            # a pull for both images can take longer than this step's
            # command_timeout on its own — nothing to do with the healthcheck
            # wait below. It's now inside the same backgrounded block so the
            # foreground SSH step never has to survive it.
            #
            # content_service_production depends_on render's healthcheck, so
            # `docker compose up -d` for the whole stack would block on it here
            # too. Backgrounded, detached from this SSH session entirely: this
            # step only has to survive long enough to start it.
            #
            # `nohup ... &` alone does NOT detach this from the SSH session: it
            # only redirects stdout/stderr and ignores SIGHUP, but the child still
            # inherits fd 0 (stdin) from the session's pty. sshd can keep the
            # channel open until every process holding that pty has exited, so
            # this step's own command_timeout was racing the backgrounded pull —
            # which is exactly what showed up live in this step's log instead of
            # staying invisible in deploy.log. `setsid` starts a real new session,
            # fully detached from the controlling terminal, and `</dev/null`
            # closes the last tie to the pty (stdin) — together these guarantee
            # this step returns as soon as the script below is launched, instead
            # of depending on timing.
            setsid nohup bash -c '
              set -e
              docker compose pull

              # Migrations run before the new image serves traffic, as a one-off
              # container: a failed migration stops the deploy instead of leaving
              # the app up against a schema it cannot read. --no-deps keeps it from
              # starting the render service just to run prisma.
              # docker compose run --rm --no-deps --entrypoint "" \
              #   content_service_production \
              #   npm run db:deploy

              docker compose up -d --no-deps render_service_production

              elapsed=0
              while [ "$(docker inspect -f "{{.State.Health.Status}}" render_service_production 2>/dev/null)" != "healthy" ]; do
                if [ "$elapsed" -ge 180 ]; then
                  echo FAILED > deploy-status.txt
                  docker compose logs --tail=100 render_service_production >> deploy.log 2>&1
                  exit 1
                fi
                sleep 10
                elapsed=$((elapsed + 10))
              done

              docker compose up -d
              echo DONE > deploy-status.txt

              # Cleanup runs after DONE is already written. `docker image prune -af`
              # used to gate this status file, and on a host running ~20 other
              # services under double-digit load it has been observed to run long
              # enough on its own to blow through the polling budget below even
              # after the deploy itself had already finished — bumping that budget
              # once already didn't fix it, because prune's runtime is unbounded,
              # not a one-off slow step like the pull or healthcheck above. `-a`
              # also scans every image on the host, not just ours, risking an
              # unrelated service's image mid-restart. Scoped here to just these
              # two repos' old tags, and never allowed to affect the reported result.
              for repo in content-service render-service; do
                docker images "ghcr.io/${{ secrets.GHCR_OWNER }}/$repo" --format "{{.Repository}}:{{.Tag}}" \
                  | grep -v ":production$" \
                  | grep -v ":${{ steps.meta.outputs.short_sha }}$" \
                  | xargs -r docker rmi -f
              done || true
            ' < /dev/null > deploy.log 2>&1 &
            disown

            echo "Deploy kicked off in the background — polling for it next"

      - name: Load deploy SSH key for polling
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Wait for deployment to finish
        run: |
          set -e
          REMOTE="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          APP_PATH="${{ secrets.VPS_APP_PATH }}/content-service/production"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          # Each check is its own short connection — nothing here holds one SSH
          # session open across the whole wait, which is exactly what the
          # previous approach couldn't survive. The budget below (15 minutes)
          # has to cover docker compose pull too now, and pulls on this host
          # have been observed to run past 2 minutes on their own.
          for i in $(seq 1 60); do
            STATUS=$(ssh $SSH_OPTS "$REMOTE" "cd $APP_PATH && cat deploy-status.txt 2>/dev/null || true")

            if [ "$STATUS" = "DONE" ]; then
              echo "Deploy finished successfully"
              ssh $SSH_OPTS "$REMOTE" "cd $APP_PATH && docker compose ps content_service_production && rm -f deploy-status.txt deploy.log"
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "::error::Deploy failed on the server — dumping its log"
              ssh $SSH_OPTS "$REMOTE" "cd $APP_PATH && cat deploy.log && rm -f deploy-status.txt deploy.log"
              exit 1
            fi

            echo "Still deploying... ($((i * 15))s elapsed)"
            sleep 15
          done

          echo "::error::Deploy did not finish within 15 minutes"
          exit 1
